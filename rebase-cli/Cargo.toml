[package]
name = "rebase-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Rebase command-line interface"
license = "MIT"
repository = "https://github.com/austinkregel/rebase"
keywords = ["rebase", "cli", "ssh", "oidc"]
categories = ["command-line-utilities"]

[[bin]]
name = "rebase"
path = "src/main.rs"

[dependencies]
rebase-core = { path = "../rebase-core", version = "0.1.0" }
clap        = { version = "4", features = ["derive"] }
anyhow      = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
reqwest     = { workspace = true }
rustls      = { version = "0.23", features = ["ring"] }
open        = "5"
