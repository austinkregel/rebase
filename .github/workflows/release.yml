name: Release

# Tagging v1.2.3 builds the desktop app on every platform and attaches the
# bundles to a draft GitHub release. The tag is the only source of truth for the
# version: scripts/set-version.sh stamps it into package.json, tauri.conf.json
# and the Cargo manifests at build time, so releasing never requires a commit
# that bumps those five files.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  verify:
    name: Verify tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # After npm ci — stamping package.json first would leave it out of step
      # with package-lock.json, which npm ci refuses to reconcile.
      - name: Stamp the tag's version into the manifests
        run: bash scripts/set-version.sh "${{ github.event.inputs.tag || github.ref_name }}"

      - run: npm run typecheck
      - run: npm test

      # Tauri's Rust deps need the webkit stack even to type-check the crate.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf xdg-utils libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      # LanceDB's lance-encoding build script runs prost, which shells out to
      # protoc. No runner image ships it.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - run: cargo test --workspace

  release:
    name: Build ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (universal)
            runner: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - label: Linux x86_64
            runner: ubuntu-22.04
            targets: ''
            args: ''
          - label: Windows x86_64
            runner: windows-latest
            targets: ''
            args: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf xdg-utils libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev pkg-config libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      # LanceDB's lance-encoding build script runs prost, which shells out to
      # protoc. No runner image ships it, on any of the three platforms.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # aws-lc-sys (lancedb -> aws-config -> rustls) assembles its x86_64 crypto
      # with NASM, which only the Windows runner lacks.
      - uses: ilammy/setup-nasm@v1
        if: matrix.runner == 'windows-latest'
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          # LanceDB pulls in DataFusion and the AWS SDK; a cold build is long
          # enough that per-platform cache keys are worth it.
          key: ${{ matrix.runner }}

      # After npm ci and the cargo cache, both of which want the manifests as
      # committed; before tauri-action, which reads the version it stamps into
      # every bundle.
      - name: Stamp the tag's version into the manifests
        shell: bash
        run: bash scripts/set-version.sh "${{ github.event.inputs.tag || github.ref_name }}"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization. Without these the bundle is ad-hoc
          # signed and Gatekeeper blocks it on any machine but the builder's.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: rebase ${{ github.event.inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
