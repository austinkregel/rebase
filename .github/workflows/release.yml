name: Release

# Tagging v1.2.3 builds the desktop app on every platform and attaches the
# bundles to the GitHub release for that tag. The tag is the only source of
# truth for the version: scripts/set-version.sh stamps it into package.json,
# tauri.conf.json and the Cargo manifests at build time, so releasing never
# requires a commit that bumps those five files.
#
# One release per tag, created up front by create-release and then uploaded to
# by every build job. The release is published immediately and fills in as the
# platforms finish, so it is briefly visible with only some of its bundles.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  verify:
    name: Verify tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # A bad signing key otherwise surfaces in the bundler, at the very end of a
      # ~45 minute build, on all three runners at once — which is exactly how
      # v0.0.5 burned an hour. Signing a scratch file here fails in seconds.
      #
      # Verifying that signature against the pubkey pinned in tauri.conf.json
      # also catches the nastier case: a key that decodes fine but is not the key
      # clients pin. That builds green and ships updates every installed app
      # silently refuses, which is far more expensive to find later.
      - name: Preflight the updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is unset; createUpdaterArtifacts is on, so the build would fail at bundle time."
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign

          echo preflight > preflight.txt
          npx tauri signer sign preflight.txt

          # tauri base64-wraps both the signature and the pinned pubkey; unwrap
          # each so minisign can check one against the other.
          base64 -d < preflight.txt.sig > preflight.minisig
          jq -r '.plugins.updater.pubkey' src-tauri/tauri.conf.json | base64 -d > updater.pub
          if ! minisign -V -p updater.pub -m preflight.txt -x preflight.minisig; then
            echo "::error::Signing key does not match plugins.updater.pubkey in tauri.conf.json — updates signed with it would be refused by every installed app."
            exit 1
          fi
          echo "::notice::Updater signing key verified against the pinned pubkey."

      # After npm ci — stamping package.json first would leave it out of step
      # with package-lock.json, which npm ci refuses to reconcile.
      - name: Stamp the tag's version into the manifests
        run: bash scripts/set-version.sh "${{ github.event.inputs.tag || github.ref_name }}"

      - run: npm run typecheck
      - run: npm test

      # Tauri's Rust deps need the webkit stack even to type-check the crate.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf xdg-utils libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      # LanceDB's lance-encoding build script runs prost, which shells out to
      # protoc. No runner image ships it.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - run: cargo test --workspace

  # One release, created once, before anything uploads to it. The three build
  # jobs used to each hand tauri-action the same `tagName` and let it create the
  # release if missing — which is a race three ways, and how v0.0.3 ended up as
  # a published release with zero assets next to a draft holding all seven.
  create-release:
    name: Create release
    needs: verify
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.target.outputs.release_id }}
    steps:
      - name: Find or create the release
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Reuse an existing release for the tag rather than adding a second
          # one: a re-run should top up the same release, not fork it. If that
          # release is still a draft (left over from the old workflow), publish
          # it — the tag is the release, and there is only ever the one.
          ids=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                  --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          count=$(printf '%s' "$ids" | grep -c . || true)

          # Duplicates are what this job exists to prevent, so don't paper over
          # ones that already exist: picking whichever the API happened to list
          # first is how bundles end up split across two releases.
          if [ "$count" -gt 1 ]; then
            echo "::error::$count releases share tag $TAG (ids: $(echo $ids)). Delete all but one and re-run."
            exit 1
          fi

          if [ "$count" -eq 1 ]; then
            id="$ids"
            gh api "repos/$GITHUB_REPOSITORY/releases/$id" -X PATCH -F draft=false >/dev/null
            echo "::notice::Reusing release $id for $TAG"
          else
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -X POST \
                   -f tag_name="$TAG" -f name="rebase $TAG" \
                   -F draft=false -F prerelease=false --jq '.id')
            echo "::notice::Created release $id for $TAG"
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  release:
    name: Build ${{ matrix.label }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (universal)
            runner: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - label: Linux x86_64
            runner: ubuntu-22.04
            targets: ''
            args: ''
          - label: Windows x86_64
            runner: windows-latest
            targets: ''
            args: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf xdg-utils libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev pkg-config libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      # Shipped binaries otherwise embed the runner's absolute paths — the
      # checkout dir and every ~/.cargo/registry crate — in debug info and
      # panic messages. Nothing downstream can use them, and they describe the
      # build host to anyone with a hex editor.
      #
      # Cargo's own `trim-paths` profile key would be tidier but is still
      # nightly-only as of 1.94, and .tool-versions pins stable. --remap-path-prefix
      # is the stable spelling. Set before rust-cache so its key covers RUSTFLAGS;
      # set via $GITHUB_ENV because a workflow `env:` value gets no shell expansion
      # and CARGO_HOME differs on all three runners.
      - name: Strip build paths from release binaries
        shell: bash
        run: |
          echo "RUSTFLAGS=--remap-path-prefix=$GITHUB_WORKSPACE=/rebase --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo" >> "$GITHUB_ENV"

      # LanceDB's lance-encoding build script runs prost, which shells out to
      # protoc. No runner image ships it, on any of the three platforms.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # aws-lc-sys (lancedb -> aws-config -> rustls) assembles its x86_64 crypto
      # with NASM, which only the Windows runner lacks.
      - uses: ilammy/setup-nasm@v1
        if: matrix.runner == 'windows-latest'
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          # LanceDB pulls in DataFusion and the AWS SDK; a cold build is long
          # enough that per-platform cache keys are worth it.
          key: ${{ matrix.runner }}

      # After npm ci and the cargo cache, both of which want the manifests as
      # committed; before tauri-action, which reads the version it stamps into
      # every bundle.
      - name: Stamp the tag's version into the manifests
        shell: bash
        run: bash scripts/set-version.sh "${{ github.event.inputs.tag || github.ref_name }}"

      # macOS signing + notarization. Without a certificate the bundle is ad-hoc
      # signed and Gatekeeper blocks it on any machine but the builder's — but
      # the vars have to be *absent*, not empty: Tauri's bundler treats a defined
      # APPLE_CERTIFICATE as "sign this" and dies in `security import`. Passing
      # them straight through as step env would define them unconditionally,
      # since an unset secret expands to an empty string.
      - name: Enable Apple code signing
        if: matrix.runner == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::notice::No APPLE_CERTIFICATE secret — building ad-hoc signed."
            exit 0
          fi
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                     APPLE_SIGNING_IDENTITY KEYCHAIN_PASSWORD \
                     APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            printf '%s=%s\n' "$var" "${!var}" >> "$GITHUB_ENV"
          done

      # releaseId, not tagName: upload into the release create-release already
      # made. Given a tag instead, each of the three jobs would decide for
      # itself whether a release exists yet.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # createUpdaterArtifacts is on, so the bundler signs each updater
          # artifact with key B and writes a .sig beside it. Without these the
          # build fails outright rather than shipping unsigned updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  # latest.json is what an installed app polls. It is assembled here rather
  # than by the bundler because only this job can see all three platforms'
  # artifacts at once. See docs/AUTO-UPDATE.md.
  #
  # A platform missing from the manifest does not error in the client — it
  # tells that platform "you are up to date" forever. So every expected target
  # is asserted, and a missing artifact or .sig fails the release.
  updater-manifest:
    name: Assemble latest.json
    needs: [create-release, release]
    runs-on: ubuntu-22.04
    steps:
      - name: Build and attach latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          version="${TAG#v}"

          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate)

          # updater key -> the artifact suffix that serves it. The macOS build is
          # universal, so one .app.tar.gz answers for both darwin arches.
          #
          # linux-aarch64 and windows-aarch64 are absent on purpose: the release
          # matrix does not build them. Adding a key here without a matching
          # build would be worse than omitting it — the manifest would advertise
          # an artifact that does not exist.
          targets="darwin-aarch64:_universal.app.tar.gz
          darwin-x86_64:_universal.app.tar.gz
          linux-x86_64:.AppImage
          windows-x86_64:-setup.exe"

          platforms='{}'
          while IFS= read -r line; do
            key="${line%%:*}"
            suffix="${line##*:}"
            suffix="$(echo "$suffix" | xargs)"

            # Exactly one artifact must match, or the mapping above is stale.
            matches=$(echo "$assets" | jq -r --arg s "$suffix" \
              '[.[] | select(.name | endswith($s)) | select(.name | endswith(".sig") | not)] | .[].name')
            n=$(printf '%s' "$matches" | grep -c . || true)
            if [ "$n" -ne 1 ]; then
              echo "::error::$key: expected 1 artifact ending '$suffix', found $n ($(echo $matches))"
              exit 1
            fi
            name="$matches"
            url=$(echo "$assets" | jq -r --arg n "$name" '.[] | select(.name == $n) | .browser_download_url')

            sig_id=$(echo "$assets" | jq -r --arg n "$name.sig" '.[] | select(.name == $n) | .id')
            if [ -z "$sig_id" ] || [ "$sig_id" = "null" ]; then
              echo "::error::$key: '$name' has no .sig — updater signing did not run for this platform."
              exit 1
            fi
            signature=$(gh api -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$sig_id")
            if [ -z "$signature" ]; then
              echo "::error::$key: '$name.sig' is empty."
              exit 1
            fi

            platforms=$(echo "$platforms" | jq --arg k "$key" --arg u "$url" --arg s "$signature" \
              '.[$k] = {signature: $s, url: $u}')
            echo "  $key -> $name"
          done <<< "$targets"

          jq -n --arg v "$version" \
                --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg n "See https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
                --argjson p "$platforms" \
                '{version: $v, notes: $n, pub_date: $d, platforms: $p}' > latest.json

          echo "--- latest.json ---"
          jq '.platforms |= map_values({url, signature: (.signature[0:16] + "...")})' latest.json

          # Replace rather than append: a re-run must not leave two latest.json
          # assets on the release, which GitHub would disambiguate by renaming.
          old=$(echo "$assets" | jq -r '.[] | select(.name == "latest.json") | .id')
          if [ -n "$old" ] && [ "$old" != "null" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
          fi
          gh release upload "$TAG" latest.json --clobber
          echo "::notice::Attached latest.json for $version"
