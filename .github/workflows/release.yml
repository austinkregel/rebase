name: Release

# Tagging v1.2.3 builds the desktop app on every platform and attaches the
# bundles to a draft GitHub release. The version in the tag must match the
# version in package.json / tauri.conf.json / the Cargo manifests — the verify
# job enforces that, because those five files drift easily.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  verify:
    name: Verify version + tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Check version matches the tag
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          want="${tag#v}"
          fail=0
          check() {
            if [ "$2" != "$want" ]; then
              echo "::error file=$1::version is '$2', tag says '$want'"
              fail=1
            fi
          }
          check package.json              "$(jq -r .version package.json)"
          check src-tauri/tauri.conf.json "$(jq -r .version src-tauri/tauri.conf.json)"
          for manifest in src-tauri/Cargo.toml rebase-core/Cargo.toml rebase-cli/Cargo.toml; do
            check "$manifest" "$(sed -n 's/^version *= *"\(.*\)"/\1/p' "$manifest" | head -1)"
          done
          exit $fail

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Tauri's Rust deps need the webkit stack even to type-check the crate.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf xdg-utils libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - run: cargo test --workspace

  release:
    name: Build ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (universal)
            runner: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - label: Linux x86_64
            runner: ubuntu-22.04
            targets: ''
            args: ''
          - label: Windows x86_64
            runner: windows-latest
            targets: ''
            args: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf xdg-utils libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          # LanceDB pulls in DataFusion and the AWS SDK; a cold build is long
          # enough that per-platform cache keys are worth it.
          key: ${{ matrix.runner }}

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization. Without these the bundle is ad-hoc
          # signed and Gatekeeper blocks it on any machine but the builder's.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: rebase ${{ github.event.inputs.tag || github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
