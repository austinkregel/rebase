[package]
name = "rebase-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Shared auth, config, and connection primitives for Rebase"
license = "MIT"
repository = "https://github.com/austinkregel/rebase"
keywords = ["rebase", "auth", "oidc", "keychain"]
categories = ["authentication", "config"]

[dependencies]
anyhow     = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true }
reqwest    = { workspace = true }
dirs       = { workspace = true }
keyring    = { workspace = true }
url        = { workspace = true }
toml       = { workspace = true }
rustls              = { version = "0.23", features = ["ring"] }
rustls-native-certs = "0.8"
tokio-tungstenite   = { version = "0.24", features = ["rustls-tls-native-roots"] }
tokio-rustls        = "0.26"
sha2 = "0.10"
hex  = "0.4"
